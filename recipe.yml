name: 'DrupalHelps Site Building: end of Module 3'
description: "Brings a fresh Drupal 11.5 Standard site to the end of Module 3 (Media). For a fresh site only: it can't repair a half-built one."
type: Site
recipes:
  - dhsb_setup
install:
  - address
  - crop
  - datetime_range
  - field_group
  - focal_point
config:
  actions:
    core.entity_form_display.media.image.default:
      setComponents:
        -
          name: field_media_image
          options:
            type: image_focal_point
            weight: 0
            region: content
            settings:
              progress_indicator: throbber
              preview_image_style: thumbnail
              preview_link: true
              offsets: '50,50'
            third_party_settings: {  }
